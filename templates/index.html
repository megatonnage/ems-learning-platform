<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMS Learning Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }
        .subtitle {
            color: #666;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        .level-info {
            margin-top: 1rem;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #666;
        }
        .ambulance {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="ambulance">🚑</div>
        <h1>EMS Learning Platform</h1>
        <p class="subtitle">SNHD Protocol Training • NREMT Prep</p>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required placeholder="Enter your name">
            </div>
            
            <div class="form-group">
                <label for="level">NREMT Level</label>
                <select id="level" name="level" required>
                    <option value="">Select your level</option>
                    <option value="EMT">EMT</option>
                    <option value="AEMT">Advanced EMT</option>
                    <option value="PARAMEDIC">Paramedic</option>
                </select>
            </div>
            
            <div class="level-info" id="levelInfo">
                Select a level to see what you'll be studying.
            </div>
            
            <button type="submit">Start Learning</button>
        </form>
    </div>
    
    <script>
        document.getElementById('level').addEventListener('change', function() {
            const info = {
                'EMT': 'Basic Life Support, Patient Assessment, Airway Management, Trauma, Medical Emergencies',
                'AEMT': 'Advanced Assessment, IV Therapy, Medication Administration, Advanced Airway',
                'PARAMEDIC': 'Cardiac Monitoring, 12-Lead ECG, Advanced Procedures, Pharmacology, Critical Care'
            };
            document.getElementById('levelInfo').textContent = info[this.value] || 'Select a level to see what you\'ll be studying.';
        });
        
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const response = await fetch('/register', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            if (data.success) {
                window.location.href = '/dashboard';
            }
        });
    </script>
</body>
</html>
